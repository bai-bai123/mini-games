<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>角色攻击演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #3a8a3a;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  /* 精灵图：1 行 x 4 列，容器宽高比 1:4，背景图放大到 400% x 100% 切帧 */
  .character {
    width: 18vmin;
    height: 72vmin;
    background-image: url(1786347952655.jpg);
    background-repeat: no-repeat;
    background-size: 400% 100%;
    background-position: 0% 0%;
    image-rendering: -webkit-optimize-contrast;
  }
  .hint {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%);
    color: #e8f5e8; font-size: 14px; opacity: 0.85;
    text-align: center; line-height: 1.6;
    pointer-events: none;
  }
  .btn {
    margin-top: 24px;
    padding: 14px 36px;
    background: #fff;
    color: #2a6a2a;
    border: none; border-radius: 999px;
    font-size: 16px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    cursor: pointer;
  }
  .btn:active { transform: scale(0.96); }
  .combo-hud {
    margin-top: 16px;
    color: #fff; font-size: 13px; opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="character" id="char"></div>
    <button class="btn" id="atkBtn">⚔ 攻击 (空格)</button>
    <div class="combo-hud" id="combo">连击: 0</div>
    <div class="hint">按 [空格] 或 [J] 攻击<br>连续攻击从第 2 帧开始循环</div>
  </div>

<script>
(function(){
  const SPRITE = '1786347952655.jpg';

  // 4 帧在精灵图中的位置（1 行 x 4 列，帧序 1~4 = 举剑→蓄力→挥剑→命中）
  const POSITIONS = [
    '0% 0%',       // 1 举剑准备
    '33.33% 0%',   // 2 蓄力
    '66.66% 0%',   // 3 挥剑中
    '100% 0%'      // 4 命中爆发
  ];

  // 页面加载时预加载精灵图，确保首次攻击立即可用
  const preloaded = new Image();
  preloaded.src = SPRITE;

  // 节奏方案：首帧命中快闪预警 → 举剑慢 → 蓄力稍慢 → 挥剑快 → 命中稍长，总时长 ~1500ms
  const SEQUENCE = [
    { idx: 4, dur: 150 },  // 4 命中快闪预警
    { idx: 1, dur: 400 },  // 1 举剑准备
    { idx: 2, dur: 350 },  // 2 蓄力
    { idx: 3, dur: 200 },  // 3 挥剑中
    { idx: 4, dur: 400 }   // 4 命中（持续）
  ];
  const COMBO_SEQUENCE = SEQUENCE.slice(1);

  const charEl = document.getElementById('char');
  const btnEl  = document.getElementById('atkBtn');
  const comboEl = document.getElementById('combo');

  let timers = [];
  let firstAttack = true;
  let combo = 0;

  function clearTimers() {
    timers.forEach(t => clearTimeout(t));
    timers = [];
  }

  function showFrame(n) {
    charEl.style.backgroundPosition = POSITIONS[n - 1];
  }

  function playAttack() {
    clearTimers();
    combo++;
    comboEl.textContent = `连击: ${combo}`;

    const seq = firstAttack ? SEQUENCE : COMBO_SEQUENCE;
    firstAttack = false;

    showFrame(seq[0].idx);

    let acc = 0;
    for (let i = 0; i < seq.length; i++) {
      acc += seq[i].dur;
      const t = setTimeout(() => {
        if (i + 1 < seq.length) {
          showFrame(seq[i + 1].idx);
        }
      }, acc);
      timers.push(t);
    }

    const endT = setTimeout(() => {
      showFrame(1);
    }, acc + 50);
    timers.push(endT);
  }

  // 键盘控制
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'KeyJ') {
      e.preventDefault();
      playAttack();
    }
  });

  // 按钮控制
  btnEl.addEventListener('click', playAttack);

  // 初始显示站姿（帧 1）
  showFrame(1);
})();
</script>
</body>
</html>
