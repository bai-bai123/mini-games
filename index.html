<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>角色攻击演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: url(MEITU_20260811_102555772.jpg) center/cover no-repeat;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 12vh;
  }
  /* 角色容器（含阴影） */
  .char-wrap {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  /* 脚下投影 */
  .char-shadow {
    position: absolute;
    bottom: -2vmin;
    width: 24vmin;
    height: 6vmin;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 70%);
    border-radius: 50%;
    transform: scale(1);
    transition: transform 0.15s ease;
  }
  /* 精灵图：3 列 x 2 行，透明 PNG */
  .character {
    width: 36vmin;
    height: 54vmin;
    background-image: url(sprite_6frames.png);
    background-repeat: no-repeat;
    background-size: 300% 200%;
    background-position: 0% 0%;
    image-rendering: -webkit-optimize-contrast;
    position: relative;
    z-index: 2;
  }
  .hint {
    position: fixed;
    bottom: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 14px; opacity: 0.85;
    text-align: center; line-height: 1.6;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .btn {
    margin-top: 20px;
    padding: 14px 36px;
    background: rgba(255,255,255,0.92);
    color: #2a5a7a;
    border: none; border-radius: 999px;
    font-size: 16px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  .btn:active { transform: scale(0.96); }
  .combo-hud {
    margin-top: 12px;
    color: #fff; font-size: 13px; opacity: 0.85;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="char-wrap">
      <div class="char-shadow" id="shadow"></div>
      <div class="character" id="char"></div>
    </div>
    <button class="btn" id="atkBtn">⚔ 攻击 (空格)</button>
    <div class="combo-hud" id="combo">连击: 0</div>
    <div class="hint">按 [空格] 或 [J] 攻击<br>连续攻击从第 2 帧开始循环</div>
  </div>

<script>
(function(){
  const SPRITE = 'sprite_6frames.png';

  // 6 帧在精灵图中的位置（3 列 x 2 行，行优先，帧序 1~6 = 左上→右上→左下→右下）
  const POSITIONS = [
    '0% 0%',      // 1
    '50% 0%',     // 2
    '100% 0%',    // 3
    '0% 100%',    // 4
    '50% 100%',   // 5
    '100% 100%'   // 6
  ];

  // 页面加载时预加载精灵图，确保首次攻击立即可用
  const preloaded = new Image();
  preloaded.src = SPRITE;

  // 节奏方案：举剑慢→蓄力→挥剑快→命中→收招稍慢→站定，总时长 ~2100ms
  const SEQUENCE = [
    { idx: 1, dur: 400 },  // 1
    { idx: 2, dur: 350 },  // 2
    { idx: 3, dur: 200 },  // 3 命中
    { idx: 4, dur: 300 },  // 4 收招
    { idx: 5, dur: 350 },  // 5 收剑完成
    { idx: 6, dur: 500 }   // 6 站定
  ];
  const COMBO_SEQUENCE = SEQUENCE.slice(1);

  const charEl = document.getElementById('char');
  const btnEl  = document.getElementById('atkBtn');
  const comboEl = document.getElementById('combo');
  const shadowEl = document.getElementById('shadow');

  let timers = [];
  let firstAttack = true;
  let combo = 0;

  function clearTimers() {
    timers.forEach(t => clearTimeout(t));
    timers = [];
  }

  function showFrame(n) {
    charEl.style.backgroundPosition = POSITIONS[n - 1];
  }

  // 攻击时阴影动态变化
  function pulseShadow(scale) {
    shadowEl.style.transform = `scale(${scale})`;
  }

  function playAttack() {
    clearTimers();
    combo++;
    comboEl.textContent = `连击: ${combo}`;

    const seq = firstAttack ? SEQUENCE : COMBO_SEQUENCE;
    firstAttack = false;

    showFrame(seq[0].idx);
    pulseShadow(0.85);  // 蓄力时阴影缩小

    let acc = 0;
    for (let i = 0; i < seq.length; i++) {
      acc += seq[i].dur;
      const t = setTimeout(() => {
        if (i + 1 < seq.length) {
          showFrame(seq[i + 1].idx);
          // 挥剑命中时阴影放大
          if (seq[i+1].idx === 3 || seq[i+1].idx === 4) {
            pulseShadow(1.2);
          } else {
            pulseShadow(1.0);
          }
        }
      }, acc);
      timers.push(t);
    }

    const endT = setTimeout(() => {
      showFrame(1);
      pulseShadow(1.0);
    }, acc + 50);
    timers.push(endT);
  }

  // 键盘控制
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'KeyJ') {
      e.preventDefault();
      playAttack();
    }
  });

  // 按钮控制
  btnEl.addEventListener('click', playAttack);

  // 初始显示站姿（帧 1）
  showFrame(1);
})();
</script>
</body>
</html>
