const cv=document.getElementById("scene"),ctx=cv.getContext("2d");
const btn=document.getElementById("atk");
const imgs=[new Image(),new Image()];
imgs[0].src=F1;imgs[1].src=F2;
let W=0,H=0;
function resize(){
  const r=cv.getBoundingClientRect();const d=window.devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener("resize",resize);
// 怪物(简单形状)
let mhp=100,mx=0,my=0,flash=0,shake=0;
// 角色动画状态
let frame=0,animT=0,attacking=false,atkPhase=0;
let lastT=performance.now();
function draw(){
  const now=performance.now();const dt=Math.min(50,now-lastT);lastT=now;
  // 攻击动画:每100ms切一帧,共4帧(两图各2次)
  if(attacking){
    animT+=dt;
    if(animT>=120){animT-=120;atkPhase++;}
    if(atkPhase==0){frame=1;}        // 挥出(图2)
    else if(atkPhase==1){frame=0;}   // 收回(图1)
    else{attacking=false;atkPhase=0;frame=0;} // 结束
  }
  // 受击特效衰减
  if(flash>0)flash-=dt;if(shake>0)shake-=dt;
  // 怪物位置
  mx=W*0.62;my=H*0.55;
  // 背景
  ctx.fillStyle="#2a2f3a";ctx.fillRect(0,0,W,H);
  // 地面
  ctx.fillStyle="#22262e";ctx.fillRect(0,my+90,W,H-my-90);
  ctx.fillStyle="#3a4150";ctx.fillRect(0,my+86,W,8);
  // 怪物(史莱姆)
  let ox=shake>0?(Math.random()*6-3):0, oy=shake>0?(Math.random()*6-3):0;
  ctx.save();ctx.translate(mx+ox,my+oy);
  ctx.fillStyle=flash>0?"#fff":"#58c16f";
  ctx.beginPath();ctx.arc(0,20,62,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(0,0,52,0,Math.PI*2);ctx.fill();
  // 眼睛
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-16,-8,13,0,Math.PI*2);ctx.arc(16,-8,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#222";ctx.beginPath();ctx.arc(-16,-6,6,0,Math.PI*2);ctx.arc(16,-6,6,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // 血条
  ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(mx-55,my-70,110,10);
  ctx.fillStyle="#e74c3c";ctx.fillRect(mx-55,my-70,110*mhp/100,10);
  ctx.fillStyle="#fff";ctx.font="12px system-ui";ctx.textAlign="center";
  ctx.fillText("史莱姆",mx,my-78);
  // 角色(两帧图)
  const size=Math.min(280,W*0.55);
  let shakeX=attacking?(Math.random()*4-2):0;
  ctx.drawImage(imgs[frame],mx-W*0.42-size/2,my+90-size,size,size);
  ctx.restore();
  requestAnimationFrame(draw);
}
// 攻击
function attack(){
  if(!attacking){attacking=true;animT=0;frame=0;atkPhase=0;}
  mhp=Math.max(0,mhp-25);flash=150;shake=120;
  if(mhp<=0){mhp=100;}
}
btn.addEventListener("touchstart",function(e){e.preventDefault();attack();});
btn.addEventListener("mousedown",attack);
resize();requestAnimationFrame(draw);
</script>
