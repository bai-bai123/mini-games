<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>角色攻击动画 6帧</title>
<style>
html,body{margin:0;height:100%;background:#1a1c22;overflow:hidden;touch-action:none;}
#wrap{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;}
#scene{flex:1;display:block;background:#2a2f3a;}
#btn{flex:0 0 96px;display:flex;align-items:center;justify-content:center;gap:14px;}
button{flex:1;max-width:240px;height:66px;border:none;border-radius:33px;
  background:linear-gradient(135deg,#ff7a45,#ff4d4f);color:#fff;font-size:24px;font-weight:800;
  letter-spacing:4px;box-shadow:0 6px 16px rgba(255,77,79,.4);}
button:active{transform:scale(.95);}
</style>
</head>
<body>
<div id="wrap">
<canvas id="scene"></canvas>
<div id="btn"><button id="atk">⚔ 攻击</button></div>
</div>
<script>
// 精灵图：MEITU_20260810_070740175.png，2行×3列，每帧 512×768
const SHEET = 'MEITU_20260810_070740175.png';
const COLS = 3, ROWS = 2, FRAME_W = 512, FRAME_H = 768, FRAMES = 6;
const FRAME_MS = 120;        // 每帧时长（120ms × 6 ≈ 720ms 一轮）
const IDLE_INDEX = 0;        // 待机帧：第1帧（举剑）

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('atk');

const img = new Image();
img.src = SHEET;
img.onload = () => { layout(); render(-1); };
img.onerror = () => {
  ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('图片加载失败：' + SHEET, canvas.width / 2, canvas.height / 2);
};

let W = 0, H = 0, layout = null;
function layout() {
  W = canvas.width = canvas.clientWidth * devicePixelRatio;
  H = canvas.height = canvas.clientHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const cw = canvas.width / devicePixelRatio, ch = canvas.height / devicePixelRatio;
  const scale = Math.min(cw / FRAME_W, ch / FRAME_H) * 0.92;
  const dw = FRAME_W * scale, dh = FRAME_H * scale;
  layout = { dx: (cw - dw) / 2, dy: (ch - dh) / 2 - 8, dw, dh };
}

let playing = false, start = 0, last = -2;
function loop(now) {
  if (playing) {
    const f = Math.min(FRAMES - 1, Math.floor((now - start) / FRAME_MS));
    if (f !== last) { last = f; render(f); }
    if (f === FRAMES - 1 && (now - start) >= FRAME_MS * FRAMES) {
      playing = false; last = -2; render(IDLE_INDEX);
    }
  }
  requestAnimationFrame(loop);
}

function render(idx) {
  if (!layout) return;
  const cw = canvas.width / devicePixelRatio, ch = canvas.height / devicePixelRatio;
  ctx.clearRect(0, 0, cw, ch);
  // 角色
  if (img.complete && img.naturalWidth) {
    const f = idx < 0 ? IDLE_INDEX : idx;
    const sx = (f % COLS) * FRAME_W;
    const sy = Math.floor(f / COLS) * FRAME_H;
    ctx.drawImage(img, sx, sy, FRAME_W, FRAME_H, layout.dx, layout.dy, layout.dw, layout.dh);
  }
  // HUD
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = 'bold 18px system-ui';
  ctx.textAlign = 'right';
  ctx.fillText(idx < 0 ? '待机 · 按攻击' : '帧 ' + (idx + 1) + ' / 6', cw - 14, 28);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '12px system-ui';
  ctx.fillText('空格 / 鼠标 / 触摸', 14, 28);
}

function attack() {
  start = performance.now();
  last = -2;
  playing = true;
}

btn.addEventListener('touchstart', e => { e.preventDefault(); attack(); }, { passive: false });
btn.addEventListener('mousedown', attack);
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.key === 'j' || e.key === 'J') { e.preventDefault(); attack(); } });
window.addEventListener('resize', () => { layout(); render(playing ? last : IDLE_INDEX); });

requestAnimationFrame(loop);
</script>
</body>
</html>
