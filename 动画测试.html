let W = 0, H = 0, box = null;
function layout() {
  W = canvas.width = canvas.clientWidth * devicePixelRatio;
  H = canvas.height = canvas.clientHeight * devicePixelRatio;
  const cw = W / devicePixelRatio, ch = H / devicePixelRatio;
  const scale = Math.min(cw / FRAME_W, ch / FRAME_H) * 0.92;
  const dw = FRAME_W * scale, dh = FRAME_H * scale;
  box = { dx: (cw - dw) / 2, dy: (ch - dh) / 2 - 8, dw, dh };
}

let playing = false, start = 0, last = -2;
function loop(now) {
  if (playing) {
    const f = Math.min(FRAMES - 1, Math.floor((now - start) / FRAME_MS));
    if (f !== last) { last = f; render(f); }
    if (f === FRAMES - 1 && (now - start) >= FRAME_MS * FRAMES) {
      playing = false; last = -2; render(IDLE_INDEX);
    }
  }
  requestAnimationFrame(loop);
}

function render(idx) {
  if (!box) return;
  const cw = W / devicePixelRatio, ch = H / devicePixelRatio;
  ctx.clearRect(0, 0, cw, ch);
  if (img.complete && img.naturalWidth) {
    const f = idx < 0 ? IDLE_INDEX : idx;
    const sx = (f % COLS) * FRAME_W;
    const sy = Math.floor(f / COLS) * FRAME_H;
    ctx.drawImage(img, sx, sy, FRAME_W, FRAME_H, box.dx, box.dy, box.dw, box.dh);
  }
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = 'bold 18px system-ui';
  ctx.textAlign = 'right';
  ctx.fillText(idx < 0 ? '待机 · 按攻击' : '帧 ' + (idx + 1) + ' / 6', cw - 14, 28);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '12px system-ui';
  ctx.fillText('空格 / J / 鼠标 / 触摸', 14, 28);
}

function attack() {
  start = performance.now();
  last = -2;
  playing = true;
}

btn.addEventListener('touchstart', e => { e.preventDefault(); attack(); }, { passive: false });
btn.addEventListener('mousedown', attack);
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.key === 'j' || e.key === 'J') { e.preventDefault(); attack(); } });
window.addEventListener('resize', () => { layout(); render(playing ? last : IDLE_INDEX); });

requestAnimationFrame(loop);
</script>
</body>
</html>
